name: coterie
description: "Coterie — Institute for Rare & Exact Diction. Minimalist museum ticket loading experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dutch_16c_bw_grain.png
    - assets/images/dutch_16c_original.jpg
    - assets/images/paper_texture.png

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: BodoniModa
      fonts:
        - asset: assets/fonts/BodoniModa-Regular.ttf
        - asset: assets/fonts/BodoniModa-Italic.ttf
          style: italic
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
