name: coterie
description: "Coterie — Minimalist museum ticket loading experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dutch_16c_bw_grain.png
    - assets/images/paper_texture.png
    - assets/images/weather_header.png

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Niloofar
      fonts:
        - asset: assets/fonts/XBNiloofar-Regular.ttf
        - asset: assets/fonts/XBNiloofar-Bold.ttf
          weight: 700
        - asset: assets/fonts/XBNiloofar-Italic.ttf
          style: italic
    - family: ReceiptMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: EditorialSans
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
